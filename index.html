:root{
  color-scheme: light;
  --bg:#F2F5FA; --surface:#FFFFFF; --ink:#14243C; --muted:#4F617C; --line:#D8E0EB;
  --brand:#0B2A52; --on-brand:#FFFFFF; --primary:#0B2A52; --on-primary:#FFFFFF;
  --accent:#F28C0F; --accent-text:#A85800; --accent-soft:#FFF1DC;
  --good:#1B7A43; --good-soft:#E3F4EA; --bad:#B3261E; --bad-soft:#FBE9E7; --warn:#8A5A00; --warn-soft:#FFF1D0;
  --field:#FFFFFF; --veil:rgba(8,22,44,.55);
  --shadow:0 1px 2px rgba(11,42,82,.08),0 10px 28px rgba(11,42,82,.09);
  --font-display:'League Spartan','Montserrat','Arial Narrow',sans-serif;
  --font-body:'Open Sans',system-ui,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0A1730; --surface:#102240; --ink:#E7EDF7; --muted:#9FB2CE; --line:#223B60;
    --brand:#071326; --primary:#F28C0F; --on-primary:#1A1204;
    --accent-text:#FFB04A; --accent-soft:#2A2113; --good:#6FD39A; --good-soft:#12301F; --bad:#FF9C93; --bad-soft:#3A1816; --warn:#FFD27A; --warn-soft:#3A2D10;
    --field:#0F2142; --veil:rgba(2,8,18,.7);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0A1730; --surface:#102240; --ink:#E7EDF7; --muted:#9FB2CE; --line:#223B60;
  --brand:#071326; --primary:#F28C0F; --on-primary:#1A1204;
  --accent-text:#FFB04A; --accent-soft:#2A2113; --good:#6FD39A; --good-soft:#12301F; --bad:#FF9C93; --bad-soft:#3A1816; --warn:#FFD27A; --warn-soft:#3A2D10;
  --field:#0F2142; --veil:rgba(2,8,18,.7);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:max(14px,env(safe-area-inset-left,0px)) max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:1100px;margin-inline:auto}
a{color:var(--accent-text)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--brand);color:var(--on-brand);margin-inline:calc(-1 * max(14px,env(safe-area-inset-left,0px))) calc(-1 * max(14px,env(safe-area-inset-right,0px)));padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:3px solid var(--accent)}
.top .wrap{display:flex;align-items:center;gap:12px}
.top img{height:34px;display:block}
.top .ttl{font-family:var(--font-display);font-weight:800;text-transform:uppercase;letter-spacing:.4px;font-size:16px;flex:1;line-height:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.14);white-space:nowrap}
.chip.warn{background:var(--accent);color:#1A1204}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));gap:4px;box-shadow:0 -6px 20px rgba(11,42,82,.08)}
.tabs button{flex:1;max-width:150px;border:0;background:transparent;border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11.5px;font-weight:700}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
@media (min-width:860px){
  body{padding-bottom:24px}
  .tabs{position:sticky;top:calc(53px + env(safe-area-inset-top,0px));bottom:auto;justify-content:flex-start;border:0;border-bottom:1px solid var(--line);box-shadow:none;margin-inline:calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding-inline:max(14px,env(safe-area-inset-left,0px));background:var(--bg);z-index:35}
  .tabs button{flex:none;flex-direction:row;gap:8px;padding:10px 16px;font-size:14px;max-width:none}
}

h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.3px;margin:0}
.page{padding-block:18px 10px;display:flex;flex-direction:column;gap:16px}
.page>h1{font-size:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit}
.stat b{font-family:var(--font-display);font-size:30px;line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat.good b{color:var(--good)} .stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
button.stat:hover{border-color:var(--accent)}
.note{border-radius:var(--r);padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);border-color:var(--accent)}
.note.bad{background:var(--bad-soft);border-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:18px}
.mini{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini b{display:block}

.tools{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(53px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding-block:8px}
@media (min-width:860px){.tools{top:calc(100px + env(safe-area-inset-top,0px))}}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--field);padding:0 14px;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.fchip{flex:none;height:36px;padding:0 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.fchip small{color:var(--muted);font-weight:700}
.fchip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.fchip[aria-pressed="true"] small{color:inherit;opacity:.8}
select{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);padding:0 10px}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.pc.s-agotado{border-left-color:var(--bad)} .pc.s-bajo{border-left-color:var(--accent)} .pc.s-disponible{border-left-color:var(--good)} .pc.s-oculto{opacity:.65}
.pc .hd{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.pc h3{font-size:17px;line-height:1.1;overflow-wrap:anywhere}
.pc small{color:var(--muted)}
.badge{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
.b-agotado{background:var(--bad-soft);color:var(--bad)} .b-bajo{background:var(--warn-soft);color:var(--warn)} .b-disponible{background:var(--good-soft);color:var(--good)} .b-sincontrol,.b-oculto{background:var(--line);color:var(--muted)}
.prices{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.prices span b{font-variant-numeric:tabular-nums}
.stk{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stk .q{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;background:var(--field)}
.stk .q button{width:42px;height:42px;border:0;background:transparent;font-size:22px;font-weight:700;line-height:1}
.stk .q button:hover{background:var(--accent-soft)}
.stk .q input{width:78px;height:42px;border:0;border-inline:1.5px solid var(--line);text-align:center;font-weight:800;font-size:16px;background:transparent;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.more{align-self:center}

.sheetwrap{position:fixed;inset:0;z-index:80;background:var(--veil);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:min(100%,760px);max-height:94%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;overflow:hidden}
@media (min-width:860px){.sheetwrap{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.shead h2{font-size:20px}
.sbody{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);padding:0 12px;font-size:16px}
.field textarea{height:auto;min-height:64px;padding:10px 12px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.offer{display:grid;grid-template-columns:1.2fr 1fr 1fr .8fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media (max-width:640px){.offer{grid-template-columns:1fr 1fr}.offer .fin{grid-column:1/-1}}
.offer .fin{font-weight:800;font-size:16px;padding-bottom:10px;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:11px;padding:9px 12px;background:var(--surface);font-weight:600;font-size:14px}
.seg input{accent-color:var(--accent);width:18px;height:18px}
.err{background:var(--bad-soft);border:1.5px solid var(--bad);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px}
.err ul{margin:4px 0 0;padding-left:18px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:95;background:var(--brand);color:var(--on-brand);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);max-width:min(92vw,460px);font-size:14px}
@media (min-width:860px){.toast{bottom:24px}}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
.pos{color:var(--good);font-weight:800}.neg{color:var(--bad);font-weight:800}
.lockbtn{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:999px;display:grid;place-items:center}
.lockbtn svg{width:18px;height:18px}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
.lockcard{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.lockcard h1{font-size:24px}
.lockcard p{margin:0}
.rescuebox{font:700 17px/1.5 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;word-break:break-all;text-align:center;padding:14px;border:2px dashed currentColor;border-radius:12px;background:rgba(127,127,127,.12);user-select:all}
.lockbrand{background:var(--brand);border-radius:14px;padding:14px;display:flex;justify-content:center;border-bottom:3px solid var(--accent)}
.lockbrand img{height:42px}
.lockcard form{display:flex;flex-direction:column;gap:12px}
body.locked>header,body.locked>nav,body.locked>main,body.locked>#layer,body.locked>.toast{display:none !important}
body.locked{padding-bottom:0}
body:not(.locked) #lock{display:none}

const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const authRec = () => lsGet(AK) || (WEB ? null : { salt: AUTH_CFG.salt, hash: AUTH_CFG.hash, it: AUTH_CFG.it, initial: true });
const recInfo = () => { const r = lsGet(AK); return r && r.recSalt ? { salt: r.recSalt, hash: r.recHash, it: r.it } : { salt: AUTH_CFG.recSalt, hash: AUTH_CFG.recHash, it: AUTH_CFG.it }; };
const keepRescue = nr => { const r = lsGet(AK); if (r && r.recSalt) { nr.recSalt = r.recSalt; nr.recHash = r.recHash; } return nr; };
function newRescueKey() { const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', u = new Uint8Array(20); crypto.getRandomValues(u); let s = ''; for (let i = 0; i < 20; i++) { s += al[u[i] % al.length]; if (i % 4 === 3 && i < 19) s += '-'; } return 'RESCATE-' + s; }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; } catch (e) { storageOK = false; } }
function commit(render = true) { DB.rev++; persist(); chip(); if (render) draw(); }
function chip() {
  const c = $('#saveChip'); const unpub = DB.pubRev !== DB.rev;
  if (!storageOK) { c.textContent = 'Sin guardar'; c.className = 'chip warn'; return; }
  c.textContent = unpub ? 'Sin publicar' : 'Al día'; c.className = 'chip' + (unpub ? ' warn' : '');
}

const UI = { tab: 'resumen', q: '', filter: 'todos', sec: '', shown: 30, logQ: '', ed: null, edNew: false, msg: [] };

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9$%.\s-]/g, ' ').replace(/\s+/g, ' ').trim();
const byId = id => DB.products.find(p => p.id === id);
const when = iso => { try { return new Date(iso).toLocaleString('es-CL', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } };
const dayStr = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

function download(name, text, type) {
  const blob = new Blob([text], { type: type || 'text/plain' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const counts = () => { const c = { total: DB.products.length, disponible: 0, agotado: 0, bajo: 0, sincontrol: 0, oculto: 0 }; DB.products.forEach(p => { c[stOf(p)]++; }); return c; };
const LABEL = { disponible: 'Disponible', agotado: 'Agotado', bajo: 'Stock bajo', sincontrol: 'Disponible', oculto: 'Oculto' };

function draw() {
  document.querySelectorAll('#tabs button').forEach(b => { if (b.dataset.tab === UI.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  const v = $('#view'); const keep = document.activeElement && document.activeElement.id === 'q' ? { s: document.activeElement.selectionStart } : null;
  v.innerHTML = ({ resumen: vResumen, productos: vProductos, historial: vHistorial, ajustes: vAjustes, publicar: vPublicar })[UI.tab]();
  if (keep) { const q = $('#q'); if (q) { q.focus(); try { q.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
}

function vResumen() {
  const c = counts(); const unpub = DB.pubRev !== DB.rev;
  const bk = DB.lastBackup ? Math.floor((Date.now() - new Date(DB.lastBackup).getTime()) / 86400000) : null;
  const ag = DB.products.filter(p => stOf(p) === 'agotado').slice(0, 8), lo = DB.products.filter(p => stOf(p) === 'bajo').slice(0, 8);
  const mini = (p, tag) => '<div class="mini"><div><b>' + esc(p.name) + '</b><small class="muted">' + esc(C.titleCase(p.sec)) + (p.stock && p.stock.track ? ' · quedan ' + nf(p.stock.qty) + ' ' + esc(p.stock.unit || '') : '') + '</small></div><button class="btn sm" type="button" data-act="restock" data-id="' + esc(p.id) + '">' + tag + '</button></div>';

    + (bk == null || bk >= 7 ? '<div class="note"><span>' + (bk == null ? 'Aún no has hecho un respaldo.' : 'Tu último respaldo fue hace ' + bk + ' días.') + ' Guárdalo en un lugar seguro.</span><button class="btn sm" type="button" data-act="backup">Descargar respaldo</button></div>' : '')

function filtered() {
  const q = norm(UI.q); const toks = q ? q.split(' ') : [];
  return DB.products.filter(p => {
    const s = stOf(p);
    if (UI.filter === 'disponible' && !(s === 'disponible' || s === 'sincontrol' || s === 'bajo')) return false;
    if (UI.filter === 'agotado' && s !== 'agotado') return false;
    if (UI.filter === 'bajo' && s !== 'bajo') return false;
    if (UI.filter === 'sincontrol' && s !== 'sincontrol') return false;
    if (UI.filter === 'oculto' && s !== 'oculto') return false;
    if (UI.sec && p.sec !== UI.sec) return false;
    if (toks.length) { const h = norm(p.name + ' ' + p.sec + ' ' + (p.note || '')); if (!toks.every(t => h.includes(t))) return false; }
    return true;
  });
}

function closeEditor() { UI.ed = null; $('#layer').innerHTML = ''; }
function readEditor() {
  const e = UI.ed;
  e.name = $('#eName').value.trim(); e.sec = $('#eSec').value.trim(); e.note = $('#eNote').value.trim();
  const est = (document.querySelector('input[name=eEst]:checked') || {}).value || 'disponible';
  e.hidden = est === 'oculto'; e.manualAg = est === 'agotado';
  e.stock.track = $('#eTrack').checked; e.stock.qty = C.toNum($('#eQty').value); e.stock.unit = $('#eUnit').value.trim() || 'unidades'; e.stock.min = $('#eMin').value === '' ? null : C.toNum($('#eMin').value);
  if (UI.edNew) { const pg = $('#ePg') && $('#ePg').value; e.pg = pg ? Number(pg) + 1 : 1000; e._pgRaw = pg; }
  document.querySelectorAll('.offer').forEach(row => {
    const o = e.offers[+row.dataset.i];
    o.k = row.querySelector('[data-o=k]').value.trim(); o.q = row.querySelector('[data-o=q]').value.trim();
    o.base = row.querySelector('[data-o=base]').value === '' ? null : C.toNum(row.querySelector('[data-o=base]').value);
    o.pct = row.querySelector('[data-o=pct]').value === '' ? null : C.toNum(row.querySelector('[data-o=pct]').value);
  });
}
function validateEditor() {
  const e = UI.ed, m = [];
  if (!e.name) m.push('Falta el nombre del producto.');
  if (!e.sec) m.push('Falta la sección.');
  if (UI.edNew && e._pgRaw && (!Number.isInteger(Number(e._pgRaw)) || Number(e._pgRaw) < 3 || Number(e._pgRaw) > BASE.N - 2)) m.push('La página debe estar entre 3 y ' + (BASE.N - 2) + ' o quedar vacía.');
  if (!e.offers.length) m.push('Agrega al menos una presentación.');
  e.offers.forEach((o, i) => {
    const n = 'Presentación ' + (i + 1) + ': ';
    if (!o.k) m.push(n + 'falta el nombre (por ejemplo Detalle).');
    if (o.base != null && (Number.isNaN(o.base) || o.base < 0)) m.push(n + 'el precio base debe ser un número positivo.');
    if (o.pct != null && (Number.isNaN(o.pct) || o.pct < -90 || o.pct > 500)) m.push(n + 'el aumento debe estar entre -90 y 500.');
  });
  if (e.stock.track && (e.stock.qty == null || Number.isNaN(e.stock.qty) || e.stock.qty < 0)) m.push('La cantidad en stock debe ser un número positivo.');
  if (e.stock.min != null && (Number.isNaN(e.stock.min) || e.stock.min < 0)) m.push('El aviso de stock bajo debe ser un número positivo.');
  return m;
}
function saveEditor() {
  readEditor(); const m = validateEditor();
  if (m.length) { UI.msg = m; drawEditor(); const b = $('.sbody'); if (b) b.scrollTop = 0; return; }
  const e = UI.ed; delete e._pgRaw;
  if (UI.edNew) { e.id = 'A-' + (++DB.nextId); if (!e.top) { e.top = 0; e.bot = 0; } e.nc = true; DB.products.push(e); if (e.stock.track && e.stock.qty > 0) DB.log.unshift({ t: new Date().toISOString(), id: e.id, name: e.name, d: e.stock.qty, qty: e.stock.qty, note: 'Stock inicial' }); }
  else {
    const i = DB.products.findIndex(p => p.id === e.id); const prev = DB.products[i];
    const before = prev.stock && prev.stock.track ? prev.stock.qty : 0, after = e.stock.track ? e.stock.qty : 0;
    if (e.stock.track && after !== before) DB.log.unshift({ t: new Date().toISOString(), id: e.id, name: e.name, d: after - before, qty: after, note: 'Ajuste desde la ficha' });
    if (e.stock.track && before <= 0 && after > 0 && e.manualAg) { /* el dueño decide el estado manual en la ficha */ }
    DB.products[i] = e;
  }
  closeEditor(); commit(); toast('Producto guardado');
}

/* ---------- acciones ---------- */
function changeQty(id, delta, note) { C.moveStock(DB, id, delta, note || (delta > 0 ? 'Entrada' : 'Salida')); const p = byId(id); if (delta > 0 && p.manualAg && p.stock.qty > 0) p.manualAg = false; persist(); chip(); draw(); }
function setQty(id, val) { const p = byId(id); if (!p) return; const v = C.toNum(val); if (v == null || Number.isNaN(v) || v < 0) { draw(); toast('Escribe un número positivo.'); return; } const d = v - (p.stock.qty || 0); if (d !== 0) { C.moveStock(DB, id, d, 'Ajuste manual'); if (d > 0 && p.manualAg && p.stock.qty > 0) p.manualAg = false; persist(); chip(); } draw(); }
function restock(id) {
  const p = byId(id); if (!p) return;
  if (!p.stock.track) { p.stock.track = true; p.stock.qty = 0; }
  UI.tab = 'productos'; UI.q = p.name; UI.filter = 'todos'; UI.sec = ''; commit(); toast('Escribe la cantidad nueva en "' + p.name + '"');
}
function askConfirm(text, yesLabel, action) {
  UI.confirm = action;
  const L = $('#layer'); const keep = L.innerHTML;
  const d = document.createElement('div'); d.className = 'sheetwrap'; d.id = 'cfWrap'; d.style.zIndex = 90; d.style.alignItems = 'center';
  d.innerHTML = '<div class="sheet" style="max-height:none;border-radius:20px;width:min(92%,440px)"><div class="shead"><h2>Confirmar</h2></div><div class="sbody"><p style="margin:0">' + esc(text) + '</p></div><div class="sfoot"><span></span><div class="row"><button class="btn" type="button" data-act="cfno">Cancelar</button><button class="btn danger" type="button" data-act="cfyes">' + esc(yesLabel) + '</button></div></div></div>';
  document.body.appendChild(d);
}
function closeConfirm() { const d = $('#cfWrap'); if (d) d.remove(); UI.confirm = null; }

function csv(rows) { return '﻿' + rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
function backupNow() { DB.lastBackup = new Date().toISOString(); persist(); download('Respaldo_San_Martin_' + dayStr(new Date()) + '.json', JSON.stringify(DB), 'application/json'); toast('Respaldo descargado'); chip(); draw(); }
function readSettings() {
  const m = [], s = {}; const g = C.toNum($('#sGeneral').value);
  if (g == null || Number.isNaN(g) || g < -90 || g > 500) m.push('El aumento general debe ser un número entre -90 y 500.'); else s.general = g;
  let wa = $('#sWa').value.replace(/\D/g, ''); if (wa.length === 9 && wa[0] === '9') wa = '56' + wa;
  if (wa.length < 8 || wa.length > 15) m.push('El WhatsApp debe tener entre 8 y 15 dígitos, con código de país (ej. +56 9 8995 9194).'); else s.whatsapp = wa;
  const nm = $('#sNombre').value.trim(); if (!nm) m.push('Escribe el nombre del negocio.'); else s.nombre = nm;
  const lo = C.toNum($('#sLow').value); if (lo == null || Number.isNaN(lo) || lo < 0) m.push('El aviso de stock bajo debe ser un número positivo.'); else s.lowDefault = lo;
  const vd = C.toNum($('#sValid').value); if (vd == null || Number.isNaN(vd) || vd < 0 || vd > 3650) m.push('Los días de vigencia deben estar entre 0 y 3650.'); else s.validDays = Math.round(vd);
  const lk = C.toNum($('#sLockMin').value); if (lk == null || Number.isNaN(lk) || lk < 0 || lk > 720) m.push('El bloqueo automático debe estar entre 0 y 720 minutos.'); else s.lockMin = Math.round(lk);
  s.autoAg = $('#sAuto').checked; s.showLow = $('#sShowLow').checked;
  return { m, s };
}
let LAST = null; // último archivo generado
function generate() {
  const r = C.buildClient(TEMPLATE, DB, BASE, new Date().toISOString());
  LAST = { html: r.html, name: 'Catalogo_San_Martin_Clientes_' + dayStr(new Date()) + '.html', n: r.products, ag: r.agotados };
  DB.pubRev = DB.rev + 1; DB.lastPublish = new Date().toISOString(); commit(false); chip();
  return LAST;
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': UI.tab = el.dataset.tab; draw(); window.scrollTo(0, 0); break;
    case 'goto': UI.tab = 'productos'; UI.filter = el.dataset.f; UI.q = ''; UI.sec = ''; UI.shown = 30; draw(); window.scrollTo(0, 0); break;
    case 'filter': UI.filter = el.dataset.f; UI.shown = 30; draw(); break;
    case 'more': UI.shown += 30; draw(); break;
    case 'inc': changeQty(id, 1); break;
    case 'dec': { const p = byId(id); if (p && p.stock.qty > 0) changeQty(id, -1); break; }
    case 'trackon': { const p = byId(id); p.stock.track = true; p.stock.qty = 0; commit(); toast('Escribe la cantidad en stock'); break; }
    case 'toggleag': { const p = byId(id); const s = stOf(p); if (p.manualAg || s === 'agotado') { p.manualAg = false; if (p.stock.track && p.stock.qty <= 0) toast('Está en 0: súmale stock para que quede disponible.'); } else p.manualAg = true; commit(); break; }
    case 'edit': openEditor(byId(id), false); break;
    case 'new': openEditor({ id: '', pg: 1000, sec: '', name: '', note: '', top: 0, bot: 0, hidden: false, manualAg: false, offers: [{ k: 'Detalle', q: '', base: null, pct: null }], stock: { track: false, qty: 0, unit: 'unidades', min: null } }, true); break;
    case 'restock': restock(id); break;
    case 'closeed': closeEditor(); break;
    case 'saveed': saveEditor(); break;
    case 'addoffer': readEditor(); UI.ed.offers.push({ k: '', q: '', base: null, pct: null }); drawEditor(); break;
    case 'deloffer': readEditor(); UI.ed.offers.splice(+el.dataset.i, 1); drawEditor(); break;
    case 'dup': { readEditor(); const c = JSON.parse(JSON.stringify(UI.ed)); c.name = c.name + ' (copia)'; c.stock = { track: false, qty: 0, unit: c.stock.unit, min: null }; c.id = ''; c.nc = true; openEditor(Object.assign(c, { pg: 1000 }), true); break; }
    case 'askdelete': askConfirm('¿Eliminar "' + UI.ed.name + '"? Podrás recuperarlo después desde Ajustes si venía del catálogo original.', 'Eliminar', () => { const i = DB.products.findIndex(p => p.id === UI.ed.id); if (i >= 0) { const nm = DB.products[i].name; DB.products.splice(i, 1); closeEditor(); commit(); toast('"' + nm + '" eliminado'); } }); break;
    case 'cfno': closeConfirm(); break;
    case 'cfyes': { const f = UI.confirm; closeConfirm(); if (f) f(); break; }
    case 'savesettings': { const r = readSettings(); const box = $('#setErr'); if (r.m.length) { box.innerHTML = '<div class="err"><b>Revisa esto:</b><ul>' + r.m.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>'; window.scrollTo(0, 0); break; } Object.assign(DB.settings, r.s); commit(); toast('Ajustes guardados'); break; }
    case 'backup': backupNow(); break;
    case 'ghsave': ghSave(); break;
    case 'ghclear': ghClear(); break;
    case 'ghpublish': ghPublishNow(); break;
    case 'lock': lockNow(); break;
    case 'forgot': showLock('recover'); break;
    case 'copyrescue': { const bt = document.querySelector('[data-act=copyrescue]'); (navigator.clipboard ? navigator.clipboard.writeText(LOCK.key || '') : Promise.reject()).then(() => { bt.textContent = 'Copiada ✓'; }, () => { bt.textContent = 'No se pudo copiar: anótala a mano'; }); } break;
    case 'backlogin': showLock('login'); break;
    case 'chpw': changePassword(); break;
    case 'restoredel': { const have = new Set(DB.products.map(p => p.id)); const miss = ORIGINAL.filter(p => !have.has(p.id)); if (!miss.length) { toast('No falta ningún producto del catálogo original.'); break; } const add = C.dbFromProducts(miss, DB.settings).products; DB.products.push(...add); commit(); toast(miss.length + ' producto(s) recuperados'); break; }
    case 'restoreall': askConfirm('Se borrarán tus cambios, el stock y el historial, y volverá el catálogo original con +30 %. ¿Continuar? (Descarga un respaldo antes si lo necesitas.)', 'Borrar y restaurar', () => { DB = C.dbFromProducts(ORIGINAL, { publicUrl: DEFAULT_PUBLIC_URL }); commit(); toast('Catálogo original restaurado'); }); break;
    case 'csvlog': download('Movimientos_stock_' + dayStr(new Date()) + '.csv', csv([['Fecha', 'Producto', 'Cambio', 'Queda', 'Nota']].concat(DB.log.map(r => [r.t, r.name, r.d, r.qty, r.note]))), 'text/csv'); break;
    case 'csvinv': download('Inventario_' + dayStr(new Date()) + '.csv', csv([['Producto', 'Seccion', 'Estado', 'Stock', 'Unidad', 'Presentaciones (precio de venta)']].concat(DB.products.map(p => [p.name, p.sec, LABEL[stOf(p)], p.stock && p.stock.track ? p.stock.qty : '', p.stock && p.stock.track ? p.stock.unit : '', p.offers.map(o => o.k + (o.q ? ' ' + o.q : '') + ': ' + (finalOf(o) == null ? 'Consultar' : finalOf(o))).join(' | ')]))), 'text/csv'); break;
    case 'publish': { const f = generate(); download(f.name, f.html, 'text/html'); toast('Archivo generado: ' + f.name); draw(); break; }
    case 'preview': { const f = LAST && DB.pubRev === DB.rev + 0 ? LAST : generate(); window.open(URL.createObjectURL(new Blob([f.html], { type: 'text/html' })), '_blank'); draw(); break; }
    case 'share': { const f = generate(); const file = new File([f.html], f.name, { type: 'text/html' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) navigator.share({ files: [file], title: 'Catálogo ' + DB.settings.nombre, text: clientMsg() }).catch(() => {});
      else { download(f.name, f.html, 'text/html'); toast('Se descargó el archivo. Envíalo por WhatsApp o correo.'); }
      draw(); break; }
    case 'inetpkg': { const nowIso = new Date().toISOString(); const r = C.buildInternetPackage(TEMPLATE, DB, BASE, nowIso, { i192: b64u8(ICON192), i512: b64u8(ICON512) }); download('Catalogo_San_Martin_Internet_' + dayStr(new Date()) + '.zip', r.zip, 'application/zip'); DB.pubRev = DB.rev + 1; DB.lastPublish = nowIso; commit(false); chip(); toast('Paquete para internet generado'); draw(); break; }
    case 'copymsg': (navigator.clipboard ? navigator.clipboard.writeText(clientMsg()) : Promise.reject()).then(() => toast('Mensaje copiado'), () => toast('No se pudo copiar. Selecciona el texto y cópialo.')); break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'q') { UI.q = t.value; UI.shown = 30; clearTimeout(draw.t); draw.t = setTimeout(draw, 160); }
  else if (t.id === 'logQ') { UI.logQ = t.value; clearTimeout(draw.t2); draw.t2 = setTimeout(() => { draw(); const l = $('#logQ'); if (l) { l.focus(); l.setSelectionRange(l.value.length, l.value.length); } }, 160); }
  else if (t.closest && t.closest('.offer') && UI.ed) { const row = t.closest('.offer'); const o = { base: row.querySelector('[data-o=base]').value === '' ? null : C.toNum(row.querySelector('[data-o=base]').value), pct: row.querySelector('[data-o=pct]').value === '' ? null : C.toNum(row.querySelector('[data-o=pct]').value) }; const f = (o.base == null || Number.isNaN(o.base) || Number.isNaN(o.pct)) ? null : finalOf(o); row.querySelector('[data-fin]').textContent = f == null ? 'Consultar' : money(f); }
  else if (t.id === 'eTrack') { $('#eStockBox').hidden = !t.checked; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.qty) setQty(t.dataset.qty, t.value);
  else if (t.id === 'secSel') { UI.sec = t.value; UI.shown = 30; draw(); }
  else if (t.id === 'pubUrl') { const v = t.value.trim(); if (v && !/^https:\/\/[^\s]+$/i.test(v)) { toast('El enlace debe empezar con https://'); t.value = DB.settings.publicUrl || ''; return; } DB.settings.publicUrl = v; persist(); draw(); }
  else if (t.id === 'impFile' && t.files[0]) {
    const f = t.files[0]; const r = new FileReader();
    r.onload = () => { try { const db = JSON.parse(r.result); const v = C.validateDb(db); if (!v.ok) { toast('Ese archivo no es un respaldo válido.'); return; } askConfirm('Se reemplazarán tus datos actuales por los del respaldo (' + db.products.length + ' productos). ¿Continuar?', 'Importar', () => { DB = db; commit(); toast('Respaldo importado'); }); } catch (e) { toast('Ese archivo no es un respaldo válido.'); } };
    r.readAsText(f); t.value = '';
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#cfWrap')) closeConfirm(); else if (UI.ed) closeEditor(); } });

/* ---------- publicación automática (GitHub Pages) ---------- */
const GHK = 'sm_admin_gh_v1';
const ghCfg = () => lsGet(GHK);
const ghIcons = () => ({ i192: b64u8(ICON192), i512: b64u8(ICON512) });
async function ghSave() {
  const owner = $('#ghOwner').value.trim(), repo = $('#ghRepo').value.trim(); let token = $('#ghToken').value.trim();
  const cur = ghCfg(); if (!token && cur && cur.owner === owner && cur.repo === repo) token = cur.token;
  const msg = h => { const m = $('#ghMsg'); if (m) m.innerHTML = h; };
  const bad = C.ghValid({ owner, repo, token }); if (bad) { msg('<div class="err">' + esc(bad) + '</div>'); return; }
  msg('<div class="note">Probando la conexión…</div>');
  const r = await C.ghCheck({ owner, repo, token });
  if (!r.ok) { msg('<div class="err">' + esc(r.error) + '</div>'); return; }
  lsSet(GHK, { owner, repo, token });
  DB.settings.publicUrl = r.url; persist();
  const warn = (r.canPush === false ? ' El token solo puede leer: debe permitir escribir (Contents: Read and write).' : '') + (r.isPrivate ? ' El repositorio es privado: para que los clientes lo vean debe ser público.' : '') + (r.pagesEnabled === false ? ' GitHub Pages aún no está activado: se activa solo al publicar si el token lo permite; si no, actívalo en Settings > Pages del repositorio.' : '');
  msg('<div class="' + (warn ? 'note warn' : 'note') + '"><span><b>Conexión correcta.</b> Tu enlace será ' + esc(r.url) + '.' + esc(warn) + '</span></div>');
  toast('Publicación automática configurada'); chip();
}
function ghClear() { try { localStorage.removeItem(GHK); } catch (e) {} const m = $('#ghMsg'); if (m) m.innerHTML = '<div class="note">Se quitó el token de este equipo.</div>'; draw(); }
async function ghPublishNow() {
  const cfg = ghCfg(); const box = $('#pubMsg'); const say = (h, cls) => { if (box) box.innerHTML = '<div class="' + (cls || 'note') + '">' + h + '</div>'; };
  if (!cfg) { toast('Primero configura la publicación en Ajustes.'); return; }
  const btn = document.querySelector('[data-act="ghpublish"]'); if (btn) btn.disabled = true;
  try {
    const nowIso = new Date().toISOString(); const pkg = C.buildInternetFiles(TEMPLATE, DB, BASE, nowIso, ghIcons()); const files = pkg.files.filter(f => f.name !== 'LEEME.txt');
    say('Publicando… 0 de ' + (files.length + 1));
    const r = await C.ghPublish({ owner: cfg.owner, repo: cfg.repo, token: cfg.token, files: files, onProgress: (n, i, tot) => say('Publicando… ' + i + ' de ' + tot) });
    if (!r.ok) { say('<b>No se pudo publicar.</b> ' + esc(r.error), 'err'); return; }
    DB.pubRev = DB.rev + 1; DB.lastPublish = nowIso; DB.settings.publicUrl = r.url; commit(false); chip();
    say('<b>Publicado.</b> Se subieron ' + r.updated.length + ' archivos. Verificando que ya se vea en internet…');
    let live = false;
    for (let i = 0; i < 20 && !live; i++) { try { const x = await fetch(r.url + '?v=' + Date.now(), { cache: 'no-store' }); if (x.ok) live = (await x.text()).indexOf(nowIso) >= 0; } catch (e) {} if (!live) await new Promise(res => setTimeout(res, 6000)); }
    say(live ? '<b>Listo: ya está visible.</b> Tus clientes ven los datos nuevos en ' + esc(r.url) : '<b>Publicado.</b> GitHub tarda 1 a 3 minutos en mostrar los cambios. Pruébalo en ' + esc(r.url) + (r.pagesEnabled === false && !r.pagesEnabledNow ? '<br>Falta activar GitHub Pages en el repositorio (Settings &gt; Pages &gt; Deploy from a branch &gt; main / root).' : ''), live ? 'note ok' : 'note');
    toast(live ? 'Publicado y visible' : 'Publicado');
  } catch (e) { say('<b>No se pudo publicar.</b> ' + esc(String(e && e.message || e)), 'err'); }
  finally { if (btn) btn.disabled = false; }
}

const lockMinutes = () => (DB && DB.settings.lockMin != null ? DB.settings.lockMin : 30);
function touch() { lastAct = Date.now(); try { sessionStorage.setItem(SS, String(lastAct)); } catch (e) {} }
function startApp() { if (!STARTED) { STARTED = true; DB = load() || C.dbFromProducts(ORIGINAL, { publicUrl: DEFAULT_PUBLIC_URL }); } chip(); draw(); }
function unlock() { UNLOCKED = true; document.body.classList.remove('locked'); $('#lock').innerHTML = ''; touch(); startApp(); window.scrollTo(0, 0); }
function lockNow() { if (!UNLOCKED) return; UNLOCKED = false; try { sessionStorage.removeItem(SS); } catch (e) {} closeEditor(); closeConfirm(); document.body.classList.add('locked'); showLock('login'); }
